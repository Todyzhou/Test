<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>话题详情 - 话题社区</title>
    <link rel="stylesheet" href="../assets/css/dark-theme.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/community.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .topic-header {
            background-color: var(--card-bg);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            margin-bottom: var(--space-lg);
            text-align: center;
        }
        
        .topic-title {
            font-size: var(--text-3xl);
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: var(--space-md);
        }
        
        .topic-description {
            font-size: var(--text-lg);
            color: var(--text-secondary);
            margin-bottom: var(--space-lg);
            line-height: 1.6;
        }
        
        .topic-stats {
            display: flex;
            justify-content: center;
            gap: var(--space-xl);
            margin-bottom: var(--space-lg);
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-number {
            font-size: var(--text-2xl);
            font-weight: 700;
            color: var(--text-primary);
            display: block;
        }
        
        .stat-label {
            font-size: var(--text-sm);
            color: var(--text-muted);
        }
        
        .topic-actions {
            display: flex;
            justify-content: center;
            gap: var(--space-md);
        }
        
        .follow-topic-btn {
            padding: var(--space-sm) var(--space-xl);
            background-color: var(--accent-blue);
            color: var(--text-primary);
            border-radius: var(--radius-full);
            font-weight: 600;
            transition: all var(--transition-fast);
        }
        
        .follow-topic-btn:hover {
            background-color: var(--accent-blue-hover);
            transform: translateY(-1px);
        }
        
        .follow-topic-btn.following {
            background-color: var(--tertiary-bg);
            border: 1px solid var(--border-primary);
        }
        
        .share-topic-btn {
            padding: var(--space-sm) var(--space-lg);
            background-color: var(--tertiary-bg);
            color: var(--text-primary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-full);
            font-weight: 600;
            transition: all var(--transition-fast);
        }
        
        .share-topic-btn:hover {
            background-color: var(--hover-bg);
        }
        
        .topic-tabs {
            background-color: var(--card-bg);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            margin-bottom: var(--space-lg);
            overflow: hidden;
        }
        
        .tab-list {
            display: flex;
            border-bottom: 1px solid var(--border-primary);
        }
        
        .tab-button {
            flex: 1;
            padding: var(--space-md) var(--space-lg);
            background: transparent;
            color: var(--text-secondary);
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .tab-button:hover {
            background-color: var(--hover-bg);
            color: var(--text-primary);
        }
        
        .tab-button.active {
            background-color: var(--accent-blue);
            color: var(--text-primary);
        }
        
        .related-topics {
            background-color: var(--card-bg);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
        }
        
        .related-topics h3 {
            font-size: var(--text-lg);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-md);
        }
        
        .related-topic-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-sm) 0;
            border-bottom: 1px solid var(--border-primary);
        }
        
        .related-topic-item:last-child {
            border-bottom: none;
        }
        
        .related-topic-name {
            color: var(--accent-blue);
            font-weight: 500;
        }
        
        .related-topic-count {
            font-size: var(--text-sm);
            color: var(--text-muted);
        }
        
        @media (max-width: 768px) {
            .topic-stats {
                gap: var(--space-lg);
            }
            
            .topic-actions {
                flex-direction: column;
                align-items: center;
            }
            
            .tab-list {
                flex-direction: column;
            }
        }
    </style>
</head>
<body class="dark-theme">
    <!-- 顶部导航栏 -->
    <header class="top-nav">
        <div class="nav-container">
            <div class="nav-left">
                <a href="../community.html" class="logo">
                    <i class="fas fa-arrow-left"></i>
                    <span>返回</span>
                </a>
            </div>
            
            <div class="nav-center">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="搜索话题、用户或内容..." id="searchInput">
                </div>
            </div>
            
            <div class="nav-right">
                <button class="nav-btn" id="notificationBtn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge">3</span>
                </button>
                <button class="nav-btn" id="messageBtn">
                    <i class="fas fa-envelope"></i>
                    <span class="notification-badge">1</span>
                </button>
                <div class="user-menu">
                    <img src="https://via.placeholder.com/32x32/4a5568/ffffff?text=U" alt="用户头像" class="user-avatar">
                </div>
            </div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main class="main-container">
        <!-- 中间内容区域 -->
        <section class="main-content" style="grid-column: 1 / -1; max-width: 800px; margin: 0 auto;">
            <!-- 话题头部 -->
            <div class="topic-header">
                <h1 class="topic-title" id="topicTitle">#前端开发</h1>
                <p class="topic-description">
                    分享前端开发技术、经验和最新趋势。包括HTML、CSS、JavaScript、React、Vue等相关内容。
                </p>
                
                <div class="topic-stats">
                    <div class="stat-item">
                        <span class="stat-number">12.5K</span>
                        <span class="stat-label">讨论</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">3.2K</span>
                        <span class="stat-label">参与者</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number">156</span>
                        <span class="stat-label">今日新增</span>
                    </div>
                </div>
                
                <div class="topic-actions">
                    <button class="follow-topic-btn" id="followTopicBtn">
                        <i class="fas fa-plus"></i>
                        关注话题
                    </button>
                    <button class="share-topic-btn" id="shareTopicBtn">
                        <i class="fas fa-share"></i>
                        分享
                    </button>
                </div>
            </div>

            <!-- 话题标签页 -->
            <div class="topic-tabs">
                <div class="tab-list">
                    <button class="tab-button active" data-tab="latest">最新</button>
                    <button class="tab-button" data-tab="hot">热门</button>
                    <button class="tab-button" data-tab="media">媒体</button>
                </div>
            </div>

            <!-- 动态发布器 -->
            <div class="post-composer" id="postComposer">
                <div class="composer-header">
                    <img src="https://via.placeholder.com/40x40/4a5568/ffffff?text=U" alt="用户头像" class="user-avatar">
                    <div class="composer-input">
                        <textarea placeholder="分享关于 #前端开发 的想法..." id="postContent" maxlength="280"></textarea>
                        <div class="composer-tools">
                            <div class="tools-left">
                                <button class="tool-btn" title="添加图片">
                                    <i class="fas fa-image"></i>
                                </button>
                                <button class="tool-btn" title="添加话题">
                                    <i class="fas fa-hashtag"></i>
                                </button>
                                <button class="tool-btn" title="提及用户">
                                    <i class="fas fa-at"></i>
                                </button>
                            </div>
                            <div class="tools-right">
                                <span class="char-count">0/280</span>
                                <button class="post-btn" id="publishBtn" disabled>发布</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 动态流 -->
            <div class="timeline" id="timeline">
                <!-- 动态卡片将通过JavaScript动态生成 -->
            </div>
            
            <!-- 加载更多 -->
            <div class="load-more" id="loadMore">
                <button class="load-btn">加载更多</button>
            </div>
        </section>

        <!-- 右侧相关话题 -->
        <aside class="sidebar-right" style="display: none;">
            <div class="related-topics">
                <h3>相关话题</h3>
                <div class="related-topic-item">
                    <span class="related-topic-name">#JavaScript</span>
                    <span class="related-topic-count">8.7K</span>
                </div>
                <div class="related-topic-item">
                    <span class="related-topic-name">#React</span>
                    <span class="related-topic-count">6.3K</span>
                </div>
                <div class="related-topic-item">
                    <span class="related-topic-name">#Vue</span>
                    <span class="related-topic-count">4.9K</span>
                </div>
                <div class="related-topic-item">
                    <span class="related-topic-name">#CSS</span>
                    <span class="related-topic-count">5.2K</span>
                </div>
                <div class="related-topic-item">
                    <span class="related-topic-name">#HTML</span>
                    <span class="related-topic-count">3.8K</span>
                </div>
            </div>
        </aside>
    </main>

    <!-- 脚本文件 -->
    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/post-composer.js"></script>
    <script src="../assets/js/timeline.js"></script>
    <script src="../assets/js/topic.js"></script>
    <script>
        // 初始化话题页面
        document.addEventListener('DOMContentLoaded', function() {
            initTopicPage();
        });
    </script>
</body>
</html>
